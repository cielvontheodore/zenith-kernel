name: Release Zenith Kernel

# Optional: build and cache a pinned kernel whenever you tag a release, and
# record which flake.lock (i.e. which exact nixpkgs/patch revisions) it was
# built against, so you can reproduce that exact build later.
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - name: Add extra swap
        run: |
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Configure Cachix
        uses: cachix/cachix-action@v15
        with:
          name: zenith-kernel
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Build Zenith kernel
        run: nix build .#zenithKernel -L

      - name: Record build provenance
        run: |
          echo "Kernel store path:" > release-notes.txt
          nix path-info .#zenithKernel >> release-notes.txt
          echo >> release-notes.txt
          echo "flake.lock at this tag:" >> release-notes.txt
          cat flake.lock >> release-notes.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.txt
