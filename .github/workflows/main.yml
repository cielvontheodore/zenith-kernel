name: Build Zenith TKG Kernel

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libncurses-dev \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            bc \
            git \
            rsync \
            kmod \
            cpio \
            zstd \
            ccache \
            dwarves \
            pahole \
            zstd \
            tar

      - name: Make scripts executable
        run: |
          chmod +x scripts/*.sh || true

      - name: Run TKG Build Non-Interactively
        run: |
          # Memaksa TKG membaca file customization.cfg tanpa minta prompt user
          export _interactive="false"
          export NONINTERACTIVE="true"
          ./scripts/build-tkg.sh

      - name: Run Package Script
        if: success()
        run: |
          if [ -f "./scripts/package-tarball.sh" ]; then
            ./scripts/package-tarball.sh
          fi

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zenith-kernel-build
          path: |
            *.tar.*
            *.deb
            *.pkg.tar.zst
            out/
            logs/
            *.log
          if-no-files-found: warn