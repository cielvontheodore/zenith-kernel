# =============================================================================
# Zenith Kernel — linux-tkg customization.cfg
#
# Pinned config for: ThinkPad T480 / Intel Core i5-8250U (Kaby Lake R,
# Skylake-class core, AVX2/BMI1/BMI2/FMA3/F16C, HWP-capable) / Intel UHD 620
# (i915) / NVMe / BTRFS / NixOS / systemd-boot.
#
# Every field below is filled in on purpose (not left empty) so linux-tkg's
# install script never has to prompt interactively — this is what lets it run
# unattended on a GitHub Actions runner. Values are checked against the
# current linux-tkg master customization.cfg (Frogging-Family/linux-tkg) as
# of this writing; if upstream renames/removes an option, the CI build will
# fail loudly rather than silently building the wrong thing, which is what we
# want — see docs/NOTES.md for how to re-sync this file with upstream.
# =============================================================================

_distro="Generic"
_version=""   # set at CI time via `sed` to the pinned kernel tag, see scripts/build-tkg.sh

#### MISC OPTIONS ####
_EXT_CONFIG_PATH=""
_NUKR="true"
_git_mirror=""
_kernel_work_folder=""
_kernel_source_folder=""
CUSTOM_GCC_PATH=""
CUSTOM_LLVM_PATH=""
_force_all_threads="true"
_noccache="false"

# We do NOT use _kernel_on_diet — it's mutually exclusive with modprobed-db,
# and modprobed-db (below) gives us the same "don't build modules we'll never
# load" win while still letting us force-keep essential hardware support via
# a config fragment (see zenith-t480-essential.myfrag). Diet mode has no such
# safety net, which conflicts with "never make it unbootable to save a few MB".
_kernel_on_diet="false"

# modprobed-db: trims the module list to what this specific T480 has actually
# loaded, cutting build time and image size substantially. Populated from the
# user's own machine (see docs/NOTES.md) — NOT fabricated by this repo.
# If modprobed.db is absent at build time, scripts/build-tkg.sh disables this
# automatically and falls back to the full default module set, so a missing
# db degrades to "bigger kernel", never to "kernel won't build".
_modprobeddb="true"
_modprobeddb_db_path="./modprobed.db"

_menunconfig="false"
_diffconfig="false"
_diffconfig_name=""

#### KERNEL OPTIONS ####
_configfile=""
_config_updating="olddefconfig"

# Reduces kernel debug/instrumentation overhead (lockdep-adjacent debug knobs,
# assorted CONFIG_DEBUG_* options) — pure "always-on tax" for a machine that
# isn't being used to debug the kernel itself. Real request: "reduced
# unnecessary debugging". Trade-off if something ever misbehaves: the first
# troubleshooting step is rebuilding with this flipped to "false".
_debugdisable="true"

# Stripping debug symbols shrinks the Nix store path substantially, which
# matters because the whole point of this project is fast Cachix substitution
# to the T480 — a smaller closure downloads and installs faster.
_STRIP="true"

# ---- CPU scheduler: BORE -----------------------------------------------
# BORE (Burst-Oriented Response Enhancer) is a CFS/EEVDF-derived scheduler
# tuned specifically for the case this kernel exists for: bursty, latency-
# sensitive interactive workloads (games, compositor, audio) sharing a CPU
# with background work, without the manual tuning MuQSS/PDS used to need.
# It's actively maintained and merged in current linux-tkg for modern kernels
# (6.6+), unlike PDS/BMQ/MuQSS which are increasingly legacy-kernel-only.
_cpusched="bore"

# ---- Compiler: Clang/LLVM -----------------------------------------------
_compiler="llvm"
_libunwind_replace=""
_llvm_ias="1"

# ---- LTO: Thin, not Full --------------------------------------------------
# Full LTO (single-threaded linking) squeezes out a little more cross-module
# inlining than Thin LTO, but linux-tkg's own docs flag full kernel LTO as
# "experimental and might result in an unbootable kernel". For a machine we
# are deliberately trying to NEVER have to debug/rebuild locally, that risk
# isn't worth it: Thin LTO is multi-threaded (faster, more CI-friendly),
# well-tested upstream (it's what ChromeOS and several distros ship), and
# captures the overwhelming majority of LTO's real-world benefit for a
# desktop workload. This is the "best practical gaming result" variant, not
# the theoretical-maximum one.
_lto_mode="thin"

# PREEMPT_RT is for hard real-time determinism (audio/robotics/industrial),
# and only supports the CFS scheduler — incompatible with BORE, which we're
# using specifically because it's a better fit for gaming/desktop bursts.
# RT also trades average throughput for worst-case latency guarantees we
# don't need here. Left off deliberately.
_preempt_rt="false"
_preempt_rt_force="false"

# BORE-relevant; "no yield" avoids unnecessary reschedules under load.
_sched_yield_type="0"
_rr_interval="default"

_ftracedisable="false"   # see note above: kept ON (i.e. tracer NOT disabled).
_numadisable="true"       # T480 is single-socket, no NUMA hardware exists on
                           # this platform, so NUMA-aware scheduler bookkeeping
                           # is pure overhead here — safe to drop.
_misc_adds="true"
_zenify="true"

# ---- Tickless: idle-only, not full nohz_full -----------------------------
# Full tickless (CattaRappa/nohz_full) is designed for isolated CPUs running
# a single pinned task with no scheduler interference (HPC/RT use case) and
# needs the nohz_full= cmdline + CPU isolation to actually pay off; without
# that setup it can *increase* frametime variance because the tick that
# would otherwise smooth out scheduling decisions is gone on cores that are
# still doing normal multitasking. Tickless-*idle* still eliminates timer
# interrupts while a core is idle (helps battery/thermals on a laptop)
# without touching busy-core scheduling behavior.
_tickless="2"

_acs_override="false"     # No VFIO/GPU passthrough use case here.
_glitched_base="true"

# ---- Compiler optimization level: -O2, not -O3 ---------------------------
# This is the one place we explicitly reject a "faster-sounding" option.
# Kernel-wide -O3 auto-vectorization has a real history of subtle miscompiles
# in tree-wide C code that wasn't written with aggressive vectorization in
# mind, and the kernel itself is very rarely the hot loop in real game
# frametime — userspace (driver, game engine, compositor) dominates. -O3
# mostly moves synthetic kernel micro-benchmarks, not observed frametimes,
# while adding real stability risk. Not worth it for "the target is
# real-world gaming performance ... not maximum compilation flags".
_compileroptlevel="1"

# ---- CPU targeting: march=skylake (not generic x86-64-v3) -----------------
# The i5-8250U (Kaby Lake R) is a Skylake-class core and fully supports the
# AVX2/BMI1/BMI2/FMA3/F16C instruction groups that define the x86-64-v3
# baseline, so x86-64-v3 *is* safe on this CPU. We go one step more precise
# and target "skylake" by name instead: both Clang and GCC ship a dedicated
# skylake scheduling/tuning model, so -march=skylake gets the same v3
# instruction set plus microarchitecture-accurate instruction scheduling,
# which -march=x86-64-v3 (a portable ISA-level baseline with no per-uarch
# tuning) does not provide. If you ever change hardware to something that
# isn't Skylake-derived, switch this back to a generic -v3 target rather than
# carrying this value over.
_processor_opt="skylake"

_smt_nice=""              # MuQSS/PDS only, not applicable to BORE.

# Default BORE base slice. Left at upstream default deliberately: lowering it
# further chases marginally lower worst-case latency at the cost of more
# frequent context switches (more scheduling overhead, not less), and BORE's
# whole design point is that it already adapts slice length to burst
# behavior — hand-tuning this without profiling this exact machine is more
# likely to hurt than help.
_bore_min_base_slice_ns="2000000"

_random_trust_cpu="true"  # RDRAND-backed CRNG init; faster boot, no runtime
                           # gaming impact, safe on this CPU.

# ---- Timer frequency: 1000Hz ----------------------------------------------
# 1000Hz gives the finest-grained scheduling/timer resolution available,
# directly reducing worst-case input-to-scheduler latency, at the cost of
# marginally more timer-interrupt overhead than 300/250Hz. For a gaming
# laptop that's plugged in or on a decent battery most of the time it's using
# for gaming, this is the right trade for "low input latency" over the small
# battery cost.
_timer_freq="1000"

# ---- CPU frequency behavior --------------------------------------------
# We deliberately do NOT force "ondemand" here (linux-tkg's own example
# customization.cfg does, but that's a legacy-governor default). This CPU
# has hardware P-state control (Intel HWP), and intel_pstate's "active" mode
# (the default — see _custom_commandline below, where we do NOT pass
# intel_pstate=passive) drives frequency selection in hardware, which reacts
# to load changes in microseconds instead of the kernel-timer-driven polling
# interval "ondemand"/"schedutil" use. That's a better match for bursty game
# workloads than any software governor, while still ramping down at idle for
# battery/thermals. Leaving this empty keeps the kernel/HWP default
# ("powersave", which under active-mode HWP is not the aggressive
# underclocking implied by the legacy meaning of that name).
_default_cpu_gov=""
_aggressive_ondemand="true"   # inert unless "ondemand" is selected at
                               # runtime; harmless to leave on.

# ---- Networking: BBR -------------------------------------------------------
# BBR models the actual bottleneck bandwidth/RTT instead of reacting to
# packet loss like cubic, so it resists bufferbloat much better under
# contention (e.g. a background download or update fighting with your game's
# traffic for the same link) — directly serves "optimized networking" for
# interactive/gaming traffic patterns.
_tcp_cong_alg="bbr"

# ---- Kernel command line ---------------------------------------------------
# - No "intel_pstate=passive": see CPU frequency note above, we want active/
#   HWP mode.
# - No "mitigations=off": disabling Spectre/Meltdown/MDS mitigations wasn't
#   explicitly requested and is a real security trade-off, not just a perf
#   knob; leaving mitigations at their default ("auto") is the safe choice
#   for a general-purpose laptop that also does other things.
# - "split_lock_detect=off": kept from TKG's own example — split-lock
#   detection is a well-documented source of frametime stalls/hitches in
#   several game engines that (mis)use unaligned atomics, and this directly
#   serves "consistent frametimes" / "good 1% lows" at negligible real-world
#   security cost on a personal laptop.
# - "nowatchdog": disables the NMI watchdog's periodic background work,
#   another small but real source of scheduling jitter.
# - "quiet loglevel=3": less console I/O at boot; cosmetic/boot-time only.
_custom_commandline="quiet loglevel=3 nowatchdog split_lock_detect=off"

_clear_patches="true"   # Clear Linux perf/latency patch selection, low risk.
_openrgb="false"        # No OpenRGB-controlled hardware on a ThinkPad T480.

#### SPESHUL OPTION ####
_offline="false"
_custom_pkgbase=""
_kernel_localversion="zenith-t480"
_NR_CPUS_value="8"      # i5-8250U = 4 cores / 8 threads; lower than the
                          # Arch-default 320 to shave a little scheduler
                          # bookkeeping overhead.
_install_after_building="no"   # CI packages the build output itself; see
                                 # scripts/package-tarball.sh
_logging_use_script="no"

KCFLAGS=""
KCPPFLAGS=""
KRUSTFLAGS=""

#### LEGACY OPTIONS ####
# These only affect old (5.13-5.16) kernel branches and are no-ops on our
# pinned kernel version, but are left at upstream defaults so the file stays
# valid if the pin is ever moved to an older branch.
_fsync_backport="true"
_fsync_legacy="true"
_fsync_futex2="false"
_zfsfix="true"
_runqueue_sharing=""
_irq_threading="false"

# Multi-generational LRU: better memory-pressure handling under mixed
# gaming + background-app load on a 16GB laptop. Low risk, real benefit.
_mglru="true"

# ---- NTSYNC ---------------------------------------------------------------
# NTSYNC is a fast in-kernel primitive for Wine/Proton's NT synchronization
# object emulation, replacing the old esync/fsync hacks — directly useful
# for Windows-game compatibility layers. On our pinned 6.12.x kernel it's
# still an opt-in linux-tkg patch, hence "true" here. If you bump the pin to
# 6.14+, this flag becomes a documented no-op (NTSYNC is upstream and
# selectable as a normal Kconfig symbol there instead) — see
# zenith-t480-essential.myfrag for how we then force CONFIG_NTSYNC=y.
_ntsync="true"

#### USER PATCHES ####
_community_patches=""
_user_patches="false"
_user_patches_no_confirm="false"

#### CONFIG FRAGMENTS ####
# Used for zenith-t480-essential.myfrag (forces essential T480 hardware
# support to survive modprobed-db trimming) and zenith-t480-latency.myfrag
# (forces the low-latency preemption/tick/RCU config that linux-tkg's
# scheduler selection alone doesn't fully pin down) — see docs/NOTES.md.
_config_fragments="true"
_config_fragments_no_confirm="true"
